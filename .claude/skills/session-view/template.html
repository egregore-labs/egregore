<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session View</title>
<!--
  session-view — a data-driven view of how a working session evolved.

  This file is a TEMPLATE + one instance. Everything visual is generic; the only
  thing specific to a session is the JSON in <script id="session-data">. Swap that
  block and you get a new session's page — nothing else changes.

  The spine is a list of two move types:
    • step — steady work (quiet on the spine)
    • fork — a decision or recovery, rendered as the road taken beside the roads not taken
  "How things evolved" lives in the forks.
-->
<style>
  :root {
    --paper:#f7f4ee; --paper-2:#f1ece3; --card:#fdfbf7; --card-edge:#e4ddcf;
    --ink:#1c1b18; --ink-soft:#57534a; --ink-faint:#8f897c; --rule:#d9d2c4;
    --thread:#cdbfa6; --accent:#9c4221; --accent-soft:#c8743f;
    --accent-wash:rgba(156,66,33,0.07); --chip:#efe9dd; --chip-ink:#6b6557;
    --ext-bg:rgba(156,66,33,0.10); --ext-ink:#9c4221;
    --gate:#1f6f5c; --gate-wash:rgba(31,111,92,0.09);
    --shadow:0 1px 2px rgba(28,27,24,.04), 0 8px 28px rgba(28,27,24,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  html[data-theme="dark"]{
    --paper:#141310; --paper-2:#100f0c; --card:#1c1a16; --card-edge:#2c2922;
    --ink:#ece6d8; --ink-soft:#b3ac9c; --ink-faint:#837c6c; --rule:#2a2720;
    --thread:#463f30; --accent:#e08a55; --accent-soft:#c8743f;
    --accent-wash:rgba(224,138,85,0.09); --chip:#24211b; --chip-ink:#b3ac9c;
    --ext-bg:rgba(224,138,85,0.13); --ext-ink:#e08a55;
    --gate:#5fbfa3; --gate-wash:rgba(95,191,163,0.10);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --paper:#141310; --paper-2:#100f0c; --card:#1c1a16; --card-edge:#2c2922;
      --ink:#ece6d8; --ink-soft:#b3ac9c; --ink-faint:#837c6c; --rule:#2a2720;
      --thread:#463f30; --accent:#e08a55; --accent-soft:#c8743f;
      --accent-wash:rgba(224,138,85,0.09); --chip:#24211b; --chip-ink:#b3ac9c;
      --ext-bg:rgba(224,138,85,0.13); --ext-ink:#e08a55;
      --gate:#5fbfa3; --gate-wash:rgba(95,191,163,0.10);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif);
       -webkit-font-smoothing:antialiased; line-height:1.6;}
  ::selection{background:var(--accent-wash);}
  #progress{position:fixed; top:0; left:0; height:2px; width:0; background:var(--accent); z-index:50; transition:width .1s linear;}
  #theme{position:fixed; top:16px; right:16px; z-index:40; cursor:pointer; font-family:var(--sans);
         font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--chip-ink);
         background:var(--chip); border:1px solid var(--card-edge); padding:7px 12px; border-radius:999px; transition:all .2s;}
  #theme:hover{color:var(--accent); border-color:var(--accent-soft);}
  .wrap{max-width:860px; margin:0 auto; padding:64px 28px 120px;}

  /* hero */
  .kicker{font-family:var(--sans); font-size:12px; letter-spacing:.26em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 24px;}
  h1{font-size:clamp(30px,5vw,46px); line-height:1.08; letter-spacing:-.012em; margin:0 0 22px; font-weight:600;}
  .standfirst{color:var(--ink-soft); font-size:19px; margin:0 0 14px; max-width:62ch;}
  .meta-line{font-family:var(--sans); font-size:12.5px; color:var(--ink-faint); letter-spacing:.02em; margin:0 0 40px;}
  .meta-line b{color:var(--ink-soft); font-weight:600;}

  /* stat band */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px;
         background:var(--card-edge); border:1px solid var(--card-edge); border-radius:12px; overflow:hidden; margin:0 0 56px;}
  .stat{background:var(--card); padding:18px 16px;}
  .stat .n{font-size:28px; font-weight:600; letter-spacing:-.02em; color:var(--ink); display:block; line-height:1;}
  .stat .n.accent{color:var(--accent);}
  .stat .l{font-family:var(--sans); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-top:8px; display:block;}

  /* minimap — the whole arc at a glance */
  .mini-cap{font-family:var(--sans); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 10px;}
  .minimap{display:flex; align-items:center; margin:0 0 6px; padding:4px 2px; overflow-x:auto;}
  .mininode{flex:0 0 auto; display:inline-flex; padding:6px 0; text-decoration:none;}
  .miniconn{flex:1 1 auto; height:2px; min-width:10px; background:var(--thread);}
  .mininode .mtick{width:9px; height:9px; border-radius:50%; background:var(--card); border:2px solid var(--accent-soft); transition:box-shadow .2s, border-color .2s;}
  .mininode.fork .mtick{width:11px; height:11px; border-radius:2px; transform:rotate(45deg); border-color:var(--gate); background:var(--gate-wash);}
  .mininode.fork.recovery .mtick{border-color:var(--accent); background:var(--accent-wash);}
  .mininode:hover .mtick{border-color:var(--accent);}
  .mininode.active .mtick{box-shadow:0 0 0 4px var(--accent-wash);}
  .mini-legend{font-family:var(--sans); font-size:10.5px; color:var(--ink-faint); margin:0 0 50px; display:flex; gap:16px;}
  .mini-legend b{color:var(--ink-soft); font-weight:600;}

  /* section head */
  .sec-head{font-family:var(--sans); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 4px; padding-top:8px;}
  .sec-sub{color:var(--ink-soft); font-size:16px; margin:0 0 28px; max-width:60ch;}

  /* spine */
  .flow{position:relative; margin:0 0 64px;}
  .flow::before{content:""; position:absolute; left:19px; top:14px; bottom:14px; width:2px; background:var(--thread);}
  .move{position:relative; padding:0 0 22px 56px;}
  .move .node{position:absolute; left:11px; top:4px; width:18px; height:18px; border-radius:50%;
              background:var(--card); border:2px solid var(--thread); z-index:2;}
  .move.step .node{width:14px; height:14px; left:13px; top:6px; border-color:var(--accent-soft);}
  .move.fork .node{border-color:var(--gate); background:var(--gate-wash); transform:rotate(45deg); border-radius:3px;}
  .move.fork.recovery .node{border-color:var(--accent); background:var(--accent-wash);}
  .move .phase{font-family:var(--sans); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); margin:0;}
  .move.fork .phase{color:var(--gate);}
  .move.fork.recovery .phase{color:var(--accent);}
  .move .mtitle{font-size:21px; font-weight:600; margin:2px 0 0; letter-spacing:-.01em; cursor:pointer; display:flex; align-items:baseline; gap:10px;}
  .move .mtitle .caret{font-family:var(--sans); font-size:13px; color:var(--ink-faint); transition:transform .25s; flex:none;}
  .move.open .mtitle .caret{transform:rotate(90deg); color:var(--accent);}
  .move .lede{color:var(--ink-soft); font-size:16px; margin:8px 0 0;}

  .body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s ease;}
  .move.open .body{grid-template-rows:1fr;}
  .body > div{overflow:hidden;}
  .panel{margin-top:14px; background:var(--card); border:1px solid var(--card-edge); border-radius:10px;
         padding:16px 18px; box-shadow:var(--shadow); font-size:15.5px; color:var(--ink-soft);}
  .panel p{margin:0 0 12px;} .panel p:last-child{margin-bottom:0;}
  .panel strong{color:var(--ink); font-weight:600;}
  .panel code{font-family:var(--mono); font-size:13px;}

  .chips{display:flex; flex-wrap:wrap; gap:7px; margin:12px 0 2px;}
  .chip{font-family:var(--sans); font-size:11.5px; letter-spacing:.02em; background:var(--chip); color:var(--chip-ink);
        border:1px solid var(--card-edge); border-radius:999px; padding:4px 11px;}
  .chip b{color:var(--ink); font-weight:600;}
  .chip.ext{background:var(--ext-bg); color:var(--ext-ink); border-color:transparent;}

  /* the fork — road taken beside roads not taken */
  .branch{margin-top:13px; display:grid; gap:8px;}
  .path{border-left:2px solid var(--rule); padding:8px 0 8px 15px;}
  .path.taken{border-left-color:var(--gate);}
  .fork.recovery .path.taken{border-left-color:var(--accent);}
  .path.skipped{border-left-style:dashed; opacity:.6;}
  .path .glyph{font-family:var(--sans); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;}
  .path.taken .glyph{color:var(--gate);}
  .fork.recovery .path.taken .glyph{color:var(--accent);}
  .path.skipped .glyph{color:var(--ink-faint);}
  .path .plabel{font-size:15.5px; font-weight:600; color:var(--ink); margin:3px 0 0;}
  .path.skipped .plabel{font-weight:500; color:var(--ink-soft);}
  .path .pmeta{font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); font-weight:400; margin-left:8px;}
  .path .pwhy{font-size:14px; color:var(--ink-soft); margin:3px 0 0; line-height:1.5;}

  /* artifacts */
  .arts{display:grid; gap:12px; margin:0 0 28px;}
  .art{border:1px solid var(--card-edge); border-radius:10px; padding:16px 18px; background:var(--card); box-shadow:var(--shadow);}
  .art .ah{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .art .af{font-family:var(--mono); font-size:13px; color:var(--accent); font-weight:600;}
  .art .atag{font-family:var(--sans); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);
             border:1px solid var(--card-edge); border-radius:999px; padding:2px 8px;}
  .art .ad{font-size:15px; color:var(--ink-soft); margin:8px 0 0;}
  .art a.live{font-family:var(--sans); font-size:13px; color:var(--gate); text-decoration:none; border-bottom:1px solid var(--gate); padding-bottom:1px;}
  .art a.live:hover{color:var(--accent); border-color:var(--accent);}
  .art .live-row{margin-top:10px;}

  .note{margin-top:56px; padding:20px 22px; border-left:3px solid var(--accent-soft); background:var(--accent-wash);
        border-radius:0 8px 8px 0; font-size:15px; color:var(--ink-soft);}
  .note b{color:var(--ink);}
  .foot{margin-top:48px; padding-top:20px; border-top:1px solid var(--rule); font-family:var(--sans); font-size:12px;
        color:var(--ink-faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  hr.div{border:none; border-top:1px solid var(--rule); margin:52px 0;}
  a{color:var(--accent);}
</style>
</head>
<body>
<div id="progress"></div>
<button id="theme">◐ theme</button>
<div class="wrap" id="root"></div>

<!-- ════ THE ONLY SESSION-SPECIFIC PART ════ -->
<script id="session-data" type="application/json">
{
  "meta": { "kicker": "Session Record", "title": "Untitled Session", "standfirst": "", "context": "" },
  "stats": [],
  "spineIntro": "",
  "spine": [],
  "artifactsIntro": "",
  "artifacts": [],
  "note": "",
  "foot": ["", ""]
}
</script>
<!-- ════ END SESSION-SPECIFIC PART ════ -->

<script>
  /* renderSession — the view function. Reads #session-data, builds the page.
     Generic across every session; nothing here knows about this particular one. */
  var S = JSON.parse(document.getElementById('session-data').textContent);
  var root = document.getElementById('root');

  function chips(list){
    if(!list || !list.length) return '';
    return '<div class="chips">' + list.map(function(c){
      return '<span class="chip'+(c.ext?' ext':'')+'">'+c.text+'</span>';
    }).join('') + '</div>';
  }

  function step(m, i){
    return '<div class="move step" id="m'+i+'" data-move>'
      + '<span class="node"></span>'
      + '<p class="phase">'+m.phase+'</p>'
      + '<h3 class="mtitle">'+m.title+' <span class="caret">▸</span></h3>'
      + (m.lede?'<p class="lede">'+m.lede+'</p>':'')
      + '<div class="body"><div><div class="panel">'+(m.detail||'')+chips(m.chips)+'</div></div></div>'
      + '</div>';
  }

  function path(p, taken){
    return '<div class="path '+(taken?'taken':'skipped')+'">'
      + '<span class="glyph">'+(taken?'✓ taken':'✗ not taken')+'</span>'
      + '<p class="plabel">'+p.label+(p.meta?'<span class="pmeta">'+p.meta+'</span>':'')+'</p>'
      + (p.why?'<p class="pwhy">'+p.why+'</p>':'')
      + '</div>';
  }

  function fork(m, i){
    var phaseLabel = m.phase + (m.decidedBy?' · decided by '+m.decidedBy:'');
    var branch = '<div class="branch">' + path(m.taken, true)
      + (m.notTaken||[]).map(function(p){return path(p,false);}).join('') + '</div>';
    return '<div class="move fork'+(m.kind==='recovery'?' recovery':'')+' open" id="m'+i+'" data-move>'
      + '<span class="node"></span>'
      + '<p class="phase">'+phaseLabel+'</p>'
      + '<h3 class="mtitle">'+m.title+' <span class="caret">▸</span></h3>'
      + (m.lede?'<p class="lede">'+m.lede+'</p>':'')
      + branch
      + (m.detail?'<div class="body"><div><div class="panel">'+m.detail+'</div></div></div>':'')
      + '</div>';
  }

  function artifact(a){
    return '<div class="art"><div class="ah"><span class="af">'+a.file+'</span>'
      + (a.tag?'<span class="atag">'+a.tag+'</span>':'')+'</div>'
      + (a.desc?'<p class="ad">'+a.desc+'</p>':'')
      + (a.url?'<div class="live-row"><a class="live" href="'+a.url+'">↗ '+a.url.replace(/^https?:\/\//,'')+'</a></div>':'')
      + '</div>';
  }

  var html = '';
  // hero
  html += '<p class="kicker">'+(S.meta.kicker||'Session Record')+'</p>';
  html += '<h1>'+S.meta.title+'</h1>';
  if(S.meta.standfirst) html += '<p class="standfirst">'+S.meta.standfirst+'</p>';
  if(S.meta.context) html += '<p class="meta-line">'+S.meta.context+'</p>';
  // stats
  if(S.stats && S.stats.length){
    html += '<div class="stats">' + S.stats.map(function(s){
      return '<div class="stat"><span class="n'+(s.accent?' accent':'')+'">'+s.n+'</span><span class="l">'+s.label+'</span></div>';
    }).join('') + '</div>';
  }
  // minimap — the whole arc at a glance
  if(S.spine && S.spine.length){
    html += '<p class="mini-cap">the arc</p><div class="minimap" aria-label="session arc">';
    S.spine.forEach(function(m,i){
      if(i) html += '<span class="miniconn"></span>';
      var cls = m.type==='fork' ? ('fork'+(m.kind==='recovery'?' recovery':'')) : 'step';
      var tip = (m.phase||'') + (m.title?' — '+m.title.replace(/"/g,'&quot;'):'');
      html += '<a class="mininode '+cls+'" href="#m'+i+'" data-jump="'+i+'" title="'+tip+'"><span class="mtick"></span></a>';
    });
    html += '</div><div class="mini-legend"><span><b>●</b> steady work</span><span><b>◆</b> a fork — where it could have gone another way</span></div>';
  }
  // spine
  html += '<p class="sec-head">The path</p>';
  if(S.spineIntro) html += '<p class="sec-sub">'+S.spineIntro+'</p>';
  html += '<div class="flow">' + S.spine.map(function(m,i){
    return m.type==='fork' ? fork(m,i) : step(m,i);
  }).join('') + '</div>';
  // artifacts
  if(S.artifacts && S.artifacts.length){
    html += '<hr class="div"><p class="sec-head">What it left behind</p>';
    if(S.artifactsIntro) html += '<p class="sec-sub">'+S.artifactsIntro+'</p>';
    html += '<div class="arts">' + S.artifacts.map(artifact).join('') + '</div>';
  }
  // note + foot
  if(S.note) html += '<div class="note"><p style="margin:0">'+S.note+'</p></div>';
  if(S.foot && S.foot.length){
    html += '<div class="foot">' + S.foot.map(function(f){return '<span>'+f+'</span>';}).join('') + '</div>';
  }
  root.innerHTML = html;

  // interactions
  document.querySelectorAll('[data-move] .mtitle').forEach(function(t){
    t.addEventListener('click', function(){ t.closest('[data-move]').classList.toggle('open'); });
  });
  // minimap: jump (open the target) + scroll-spy
  var minis = {};
  document.querySelectorAll('[data-jump]').forEach(function(a){
    minis[a.getAttribute('data-jump')] = a;
    a.addEventListener('click', function(e){
      e.preventDefault();
      var t = document.getElementById('m'+a.getAttribute('data-jump'));
      if(t){ t.classList.add('open'); t.scrollIntoView({behavior:'smooth', block:'center'}); }
    });
  });
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        var k = en.target.id.slice(1);
        if(minis[k]) minis[k].classList.toggle('active', en.isIntersecting);
      });
    }, {rootMargin:'-45% 0px -45% 0px'});
    document.querySelectorAll('[data-move]').forEach(function(mv){ io.observe(mv); });
  }
  var themeBtn = document.getElementById('theme'), docEl = document.documentElement;
  function paint(){
    var t = docEl.getAttribute('data-theme');
    var dark = t==='dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
    themeBtn.textContent = dark ? '○ light' : '● dark';
  }
  themeBtn.addEventListener('click', function(){
    var t = docEl.getAttribute('data-theme');
    var dark = t==='dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
    docEl.setAttribute('data-theme', dark?'light':'dark'); paint();
  });
  paint();
  var bar = document.getElementById('progress');
  addEventListener('scroll', function(){
    var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max>0 ? (h.scrollTop/max)*100 : 0) + '%';
  }, {passive:true});
</script>
</body>
</html>
