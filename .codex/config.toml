[features]
hooks = true

[tui]
# Codex currently accepts built-in footer item IDs only. Egregore's dynamic
# ◆ CONNECTED / ◇ LOCAL identity is rendered by bin/codex-session-start.sh.
status_line = [
  "model-with-reasoning",
  "git-branch",
  "current-dir",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
  "permissions",
  "approval-mode",
]
status_line_use_colors = true
