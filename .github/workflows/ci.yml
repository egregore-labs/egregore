name: CI

# One planner routes the existing strict owners. Release candidates and full
# runs are selected by the planner from the event and requested mode.
# Each pull request is tested once it is ready; develop as a whole is tested by
# the nightly full run (nightly-ci.yml), not again after every merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch:
    inputs:
      mode:
        description: Affected checks or the complete suite
        type: choice
        options: [affected, full]
        default: full
        required: true

permissions:
  contents: read
  # write: a failing pull request job cancels the rest of its own run.
  actions: write

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'affected' }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci-plan.yml
    with:
      workflow: all
      mode: ${{ inputs.mode || 'affected' }}

  shell-contracts:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.shell_contracts == 'true') }}
    name: Strict shell contracts
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shell suite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zsh procps util-linux
          # Missing Zsh must fail here, not become a passing coverage skip.
          for tool in bash jq zsh pgrep setsid; do command -v "$tool"; done

      - name: Syntax check — all shell scripts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FAIL=0
          for f in bin/*.sh bin/lib/*.sh; do
            if ! bash -n "$f" 2>/dev/null; then
              echo "FAIL: $f"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: No hardcoded internal references
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          # Check bin/ scripts for Curve-Labs references (should be parameterized)
          FOUND=$(grep -rn "Curve-Labs\|curve-labs\|curvelabs" bin/ --include='*.sh' | grep -v 'test-' || true)
          if [ -n "$FOUND" ]; then
            echo "Found internal references in bin/ scripts:"
            echo "$FOUND"
            exit 1
          fi

      - name: No unsafe .env sourcing
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FOUND=$(grep -rn 'source.*\.env' bin/ --include='*.sh' | grep -v 'test-' | grep -v '#' || true)
          if [ -n "$FOUND" ]; then
            echo "Found unsafe 'source .env':"
            echo "$FOUND"
            exit 1
          fi

      # Under pipefail, grep -q exits at its first match and the printf or
      # echo feeding it can die with a broken pipe, failing a passing check
      # at random. Tests read a variable with `grep -q PATTERN <<< "$VAR"`.
      - name: No echo or printf piped into grep -q under pipefail
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FOUND=$(grep -l pipefail bin/tests/*.sh tests/*.sh | xargs grep -nE '(printf .%s[^ ]*|echo) .\$[^ ]* \| *grep -[A-Za-z]*q' | grep -vE '^[^:]+:[0-9]+: *#' || true)
          if [ -n "$FOUND" ]; then
            echo "Found a pipe into grep -q under pipefail (use grep -q PATTERN <<< \"\$VAR\"):"
            echo "$FOUND"
            exit 1
          fi

      - name: No manual JSON construction
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FOUND=$(grep -rn '"{\\\"' bin/ --include='*.sh' | grep -v 'test-' || true)
          if [ -n "$FOUND" ]; then
            echo "Found manual JSON construction (use jq -n):"
            echo "$FOUND"
            exit 1
          fi

      - name: Local mode graceful degradation
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FAIL=0
          for script in bin/graph.sh bin/notify.sh bin/graph-op.sh; do
            if [ -f "$script" ] && ! grep -q '"local"' "$script" 2>/dev/null; then
              echo "FAIL: $script missing local mode handling"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Commands have valid structure
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: |
          FAIL=0
          COMMAND_FILES=$(find .claude/commands -name '*.md' -type f 2>/dev/null || true)
          if [ -z "$COMMAND_FILES" ]; then
            COMMAND_FILES=$(find .claude/skills -name 'SKILL.md' -type f 2>/dev/null || true)
          fi
          if [ -z "$COMMAND_FILES" ]; then
            echo "FAIL: no Claude command or skill files found"
            exit 1
          fi
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            # Every command should have content (not empty)
            LINES=$(wc -l < "$cmd" | tr -d ' ')
            if [ "$LINES" -lt 3 ]; then
              echo "FAIL: $cmd is too short ($LINES lines)"
              FAIL=1
            fi
          done <<< "$COMMAND_FILES"
          echo "Checked $(echo "$COMMAND_FILES" | wc -l | tr -d ' ') command/skill files"
          exit $FAIL

      - name: Harvest question palette contract
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-harvest-question-palette.sh

      - name: Convention parity (commit/PR format paragraphs)
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-convention-parity.sh

      - name: Run worktree tests
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-worktree.sh

      - name: Verify traced memory recall passes through untraced and nests spans when traced
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-search-traced.sh

      - name: Verify session records and personal controls
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-session-record.sh

      - name: Verify session record greeting
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-greeting-records.sh

      - name: Test greeting in Bash and Zsh
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/test-greeting.sh

      - name: Test pending-turn greeting projection
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-greeting-pending-turns.sh

      - name: Test runtime mode status
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-runtime-mode-status.sh

      - name: Test boundary consent guidance
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-boundary-check-askuserquestion.sh

      - name: Test instance isolation topologies
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-boundary-instance-isolation.sh

      - name: Test retrieval output hygiene
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-retrieval-output-hygiene.sh

      - name: Test runtime launch path
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-runtime-launch-path.sh

      - name: Test card output hygiene
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-card-output-hygiene.sh

      - name: Test prose rule contract
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-prose-check.sh

      - name: Test brown palette guidance ratchet
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-palette-guidance.sh

      - name: Test side-stripe ratchet
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-side-stripes.sh

      - name: Activity and handoff lifecycle
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-handoff-activity-lifecycle.sh

      - name: CI suite ownership
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-ci-test-ownership.sh

      - name: CI shard partition
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-suite-shard.sh
      # A pull request run stops at its first failure: the other jobs'
      # minutes would only report more of a result that is already red.
      - name: Stop the run at the first failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -o /dev/null
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          || echo "::warning::could not stop the run"

  shell-contracts-loom:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.shell_contracts == 'true') }}
    name: Strict shell contracts · loom
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shell suite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zsh procps util-linux
          # Missing Zsh must fail here, not become a passing coverage skip.
          for tool in bash jq zsh pgrep setsid; do command -v "$tool"; done

      - name: Run agent protocol smoke test
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-agent-protocol.sh

      - name: Loom routing
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-loom.sh

      - name: Loom truth
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-loom-truth.sh

      - name: Loom evals
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-loom-evals.sh

      - name: Loom learner
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-loom-learner.sh

      - name: Loom replay
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-loom-replay.sh

      - name: Loom scenarios
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-loom-scenarios.sh

      - name: Loom dashboard
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-loom-dashboard.sh

      - name: Minion workflow
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash bin/tests/test-minion-workflow.sh
      # A pull request run stops at its first failure: the other jobs'
      # minutes would only report more of a result that is already red.
      - name: Stop the run at the first failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -o /dev/null
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          || echo "::warning::could not stop the run"

  multiplayer-poc-tests:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.multiplayer == 'true') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      TZ: UTC
      LC_ALL: C.UTF-8
      NODE_ENV: ''
      NODE_OPTIONS: ''
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test multiplayer Thread protocol, governance, lifecycle, and dependency continuation
        run: node --test threads/experiments/multiplayer-poc/test/*.test.mjs
      # A pull request run stops at its first failure: the other jobs'
      # minutes would only report more of a result that is already red.
      - name: Stop the run at the first failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -o /dev/null
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          || echo "::warning::could not stop the run"

  artifacts-tests:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.artifacts == 'true') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      TZ: UTC
      LC_ALL: C.UTF-8
      NODE_ENV: ''
      NODE_OPTIONS: ''
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/egregore-artifacts/package-lock.json

      - name: Install egregore-artifacts deps
        working-directory: packages/egregore-artifacts
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Re-vendor design-system (build dist + copy into the package)
        working-directory: packages/egregore-artifacts
        run: npm run vendor

      - name: Test egregore-artifacts
        working-directory: packages/egregore-artifacts
        run: npm test

      - name: Test design-system
        working-directory: packages/design-system
        run: npm test

      - name: Require renderer dependencies for shell coverage
        run: test -d packages/egregore-artifacts/node_modules/react && test -d packages/egregore-artifacts/node_modules/react-dom

      - name: Test deterministic view rendering with installed dependencies
        run: bash bin/tests/test-view-render.sh

      - name: Test artifact dark mode with installed dependencies
        run: bash bin/tests/test-artifact-dark-mode.sh
      # A pull request run stops at its first failure: the other jobs'
      # minutes would only report more of a result that is already red.
      - name: Stop the run at the first failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -o /dev/null
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          || echo "::warning::could not stop the run"

  runtime-parity:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.runtime == 'true') }}
    name: Runtime contracts
    runs-on: ubuntu-slim
    timeout-minutes: 12
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The capability probe and packaged-runtime PTY fixtures invoke Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require Runtime fixture capabilities
        run: |
          for tool in git jq shasum; do command -v "$tool"; done
          python - <<'PY'
          import os
          import pty
          import socket

          master, slave = pty.openpty()
          os.close(master)
          os.close(slave)
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
          PY

      - name: Verify bundle freshness, skill parity, and dependency completeness
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        working-directory: packages/create-egregore
        run: npm run test:runtime

      - name: Verify packaged runtime portability
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        working-directory: packages/create-egregore
        # test:package bounds Node file concurrency for PTY timing on one CPU.
        run: npm run test:package
      # A pull request run stops at its first failure: the other jobs'
      # minutes would only report more of a result that is already red.
      - name: Stop the run at the first failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -o /dev/null
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          || echo "::warning::could not stop the run"

  runtime-contracts-python:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.runtime == 'true') }}
    name: Runtime contracts · python
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@v4
        with:
          # Frozen evaluation export verifies the manifest's original commit.
          fetch-depth: 0
      # Skill migration and Python contracts also exercise Node entry points.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.0.2 PyYAML==6.0.3

      - name: Verify strict Runtime skill migration contracts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-runtime-skill-migration.sh

      - name: Verify Runtime observations, authorization, and canonical recovery
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -o addopts='' -q
          tests/test_runtime_telemetry.py tests/test_operation_observations.py
          tests/test_runtime_observe.py tests/test_runtime_writeback.py
          tests/test_runtime_upgrade.py
          tests/test_artifact_renderer_install.py
          tests/test_runtime_source_open.py tests/test_runtime_artifacts.py
          tests/test_runtime_threads_scrolls.py tests/test_runtime_batch_recovery.py
          tests/test_runtime_research_ingest.py tests/test_runtime_contracts.py
          tests/test_harness_observe.py tests/test_runtime_continuity.py
          tests/test_runtime_taste.py tests/test_mind_notice.py
          tests/test_installation.py tests/test_otel_span.py tests/test_session_trail.py tests/test_record_outcomes.py
          tests/test_checkpoint_cost.py
          tests/test_runtime_documents.py tests/test_document_lines.py tests/test_document_modes.py tests/test_document_parity.py

      - name: Verify retrieval readiness and save preflight without live services
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -o addopts='' -q
          tests/test_qmd_retriever.py tests/test_cache_readiness_cli.py
          tests/test_save_preflight.py

      - name: Verify immutable evaluation fixtures and no-model execution
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -o addopts='' -q
          tests/test_eg_eval*.py tests/test_frozen_export.py

      - name: Verify advisory triage and immutable issue drafts without live services
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -o addopts='' -q
          tests/test_issue_triage.py tests/test_issue_triage_service.py
          tests/test_issue_triage_eval.py tests/test_github_issues.py
          tests/test_issue_reporting.py tests/test_issue_duplicates.py
          tests/test_issue_duplicate_lookup.py tests/test_issue_readiness.py

      - name: Verify CI selection, proof reuse, and cost accounting offline
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -o addopts='' -q
          tests/test_ci_plan.py tests/test_ci_workflow.py tests/test_ci_domains.py tests/test_ci_reuse.py tests/test_ci_usage.py tests/test_nightly_ci.py
          tests/test_release_ci.py tests/test_ci_flake_rerun.py
      # A pull request run stops at its first failure: the other jobs'
      # minutes would only report more of a result that is already red.
      - name: Stop the run at the first failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -o /dev/null
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          || echo "::warning::could not stop the run"

  runtime-contracts-spirit:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.runtime == 'true') }}
    name: Runtime contracts · spirit
    # The Pi, Spirit and Durable corpus exceeds Slim's hard 15-minute limit and
    # needs the verifier sandbox; keep it one strict owner on a bounded VM.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@v4
        with:
          # Record publication and memory push proofs read Git history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.0.2 PyYAML==6.0.3

      - name: Install independent verifier sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles
          # Noble ships this purpose-built profile as an inactive extra. It
          # permits bwrap setup while stripping capabilities from its children.
          # Keep global user-namespace restrictions and network isolation intact.
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          sysctl kernel.apparmor_restrict_unprivileged_userns

      - name: Install locked offline Pi fixture dependencies
        working-directory: packages/egregore-durable
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Require Runtime fixture capabilities
        run: |
          for tool in git jq shasum bwrap; do command -v "$tool"; done
          python - <<'PY'
          import os
          import pty
          import socket
          import subprocess
          import tempfile
          from pathlib import Path
          from agent_worker.local_executor import _sandbox_command, _verification_environment

          master, slave = pty.openpty()
          os.close(master)
          os.close(slave)
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
          # Prove the actual production verifier path, including its Python
          # standard library. setup-python lives outside the sandbox roots.
          with tempfile.TemporaryDirectory(prefix="runtime-verifier-") as directory:
              root = Path(directory).resolve()
              workspace = root / "worktree"
              workspace.mkdir()
              (workspace / "probe.txt").write_text("sandboxed")
              verifier = root / "verify.py"
              verifier.write_text("import unittest\nfrom pathlib import Path\nassert Path('probe.txt').read_text() == 'sandboxed'\n")
              result = subprocess.run(
                  _sandbox_command(["/usr/bin/python3", "-I", str(verifier)], workspace),
                  cwd=workspace, env=_verification_environment(workspace),
                  capture_output=True, text=True, timeout=10)
              if result.returncode != 0:
                  raise RuntimeError("Independent verifier sandbox failed: " + result.stderr)
          PY

      - name: Verify offline Spirit and Pi owner contracts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        # Private-selection and paid/live opt-ins remain unset. These suites use
        # disposable state, controlled providers, and selected byte fixtures.
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -o addopts='' -q
          tests/test_pi_*.py tests/test_spirit_*.py tests/test_local_agent_*.py
          tests/test_durable_issue.py tests/test_memory_push*.py
          tests/test_native_record_admission.py tests/test_record_*.py
          tests/test_policy_readonly.py

      - name: Verify offline Durable package contracts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        working-directory: packages/egregore-durable
        # Place the runner flag before filenames; npm test's appended arguments
        # would put it after the package's test glob.
        run: node --test --test-concurrency=1 test/*.test.js

      - name: Verify fixed nested Spirit evaluators and controlled Pi worker
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        working-directory: packages/egregore-durable
        run: node --test --test-concurrency=1 test/spirit-experiments/*.test.mjs test/spirit-transfer/*.test.mjs

      - name: Verify Spirit catalog contracts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-spirit-catalog.sh

      - name: Verify Spirit contribution contracts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-spirit-contribution.sh

      - name: Verify offline Spirit delivery contracts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-spirit-delivery.sh

      - name: Verify Spirit library contracts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-spirit-library.sh

      - name: Verify Spirit system map contracts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        run: bash tests/test-spirit-map.sh

      - name: Verify remaining offline Spirit JavaScript contracts
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        shell: bash
        run: |
          suites=()
          for suite in tests/test-spirit-*.mjs; do
            # These leaves already run through the five owned wrappers above.
            case "$suite" in
              tests/test-spirit-catalog.mjs|tests/test-spirit-contribution.mjs|tests/test-spirit-delivery.mjs|tests/test-spirit-delivery-cli.mjs|tests/test-spirit-library.mjs|tests/test-spirit-map.mjs) continue ;;
            esac
            suites+=("$suite")
          done
          test "${#suites[@]}" -gt 0
          node --test --test-concurrency=1 "${suites[@]}"
      # A pull request run stops at its first failure: the other jobs'
      # minutes would only report more of a result that is already red.
      - name: Stop the run at the first failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -o /dev/null
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          || echo "::warning::could not stop the run"


