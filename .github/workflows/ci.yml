        run: test "$CI_PLAN_RESULT" = success
      # Full history: suites and the inventory engine compute merge-bases
      # against the base, which a shallow merge-ref checkout cannot answer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install baseline suite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zsh procps lsof rsync util-linux
          # Process inspection and cleanup are required proofs, never optional skips.
          for tool in bash git python3 node jq zsh perl tar pgrep ps lsof rsync shasum setsid; do command -v "$tool"; done
          python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))'
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) < 22 ? 1 : 0)'
      - name: Resolve the base
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          MERGE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          if [ -z "$BASE" ]; then BASE="${MERGE_BASE_REF#refs/heads/}"; fi
          # A dispatch has no event base: use the instance's integration branch.
          if [ -z "$BASE" ] && [ -f egregore.json ]; then
            SCRIPT_DIR="$PWD"; . bin/lib/config.sh; BASE=$(_get_base_branch) || exit 2
          fi
          if [ -z "$BASE" ]; then BASE=develop; fi
          git fetch origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" || exit 2
          # PR and merge-queue classification uses the event's immutable base.
          # Strict dispatches cannot pass merely because base and head match.
          case "$BASE_SHA" in
            '') BASE_REF="origin/$BASE" ;;
            *[!0-9a-fA-F]*) exit 2 ;;
            *) [ "${#BASE_SHA}" -eq 40 ] || exit 2; BASE_REF="$BASE_SHA" ;;
          esac
          printf 'BASE=%s\nBASE_REF=%s\n' "$BASE" "$BASE_REF" >> "$GITHUB_ENV"
      - name: Compare shell suites
        shell: bash
        env:
          BASELINE_SUITES: ${{ needs.plan.outputs.baseline_suites }}
          BASELINE_SHARD_COUNT: ${{ needs.plan.outputs.baseline_shard_count }}
          BASELINE_STRICT: ${{ needs.plan.outputs.baseline_strict }}
        run: |
          set -o pipefail
          # Keep the run directory so every suite's head log ships with the report.
          export TMPDIR="$RUNNER_TEMP/suite-baseline"
          mkdir -p "$TMPDIR"
          # Preserve the baseline status while still writing a failed run's summary.
          set +e
          printf '%s\n' "$BASELINE_SUITES" > "$RUNNER_TEMP/baseline-selection.json"
          bash bin/suite-shard.sh --exclude-owned --selected "$RUNNER_TEMP/baseline-selection.json" ${{ matrix.shard }} "$BASELINE_SHARD_COUNT" > selected-suites.txt || exit 2
          baseline_args=(--head-first --timeout 300 --keep --base "$BASE_REF")
          case "$BASELINE_STRICT" in
            true) baseline_args+=(--strict-head) ;;
            false) ;;
            *) exit 2 ;;
          esac
          bash bin/test-baseline.sh "${baseline_args[@]}" - < selected-suites.txt | tee suite-baseline.txt
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p suite-logs
          cp "$TMPDIR"/qa-baseline.*/logs/head/*.log suite-logs/ 2>/dev/null || true
          {
            printf '## Suite baseline — shard ${{ matrix.shard }} of %s (base %s)\n\n' "$BASELINE_SHARD_COUNT" "$BASE_REF"
            printf '```text\n'
            cat suite-baseline.txt
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload baseline report
        if: ${{ always() && needs.plan.result == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-baseline-shard-${{ matrix.shard }}
          path: |
            suite-baseline.txt
            suite-logs/
          if-no-files-found: ignore
          retention-days: 7
      # A pull request run stops at its first failure: the other jobs'
      # minutes would only report more of a result that is already red.
      - name: Stop the run at the first failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -o /dev/null
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          || echo "::warning::could not stop the run"

  shellcheck:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.shellcheck == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@v4

      - name: Run ShellCheck on bin/ scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'
          severity: error
          format: gcc
      # A pull request run stops at its first failure: the other jobs'
      # minutes would only report more of a result that is already red.
      - name: Stop the run at the first failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -o /dev/null
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          || echo "::warning::could not stop the run"

  mind-fast:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.mind == 'true') }}
    name: Mind fast contracts
    runs-on: ubuntu-slim
    # The suite takes 7 to 8 minutes on a quiet runner; 10 killed it four times
    # in two days under load (#2022). The cap stays, with room for a slow runner.
    timeout-minutes: 15
    steps:
      - name: Require successful CI plan
        env:
          CI_PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$CI_PLAN_RESULT" = success
      - uses: actions/checkout@v4
      - name: Fetch the exporter before compositions (compose.py PARITY_BASE)
        run: git fetch --no-tags --depth=1 origin c3866536ed556510869f78c1a9b61de54f3f98b6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic Python, pure JS and worker contracts
        # Child-cleanup proofs inspect process state; slim images do not promise ps.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends procps
          python3 experiments/egregore-mind/mind/tests/gate.py --profile fast --out "$RUNNER_TEMP/mind-fast"
      - name: Retain this run's exact Mind evidence
        if: ${{ always() && needs.plan.result == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mind-fast-contracts
          path: ${{ runner.temp }}/mind-fast
          if-no-files-found: error
          retention-days: 7
      # A pull request run stops at its first failure: the other jobs'
      # minutes would only report more of a result that is already red.
      - name: Stop the run at the first failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -o /dev/null
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          || echo "::warning::could not stop the run"

  full-result:
    name: Full CI result — ${{ github.sha }}
    needs:
      - plan
      - shell-contracts
      - shell-contracts-loom
      - multiplayer-poc-tests
      - artifacts-tests
      - runtime-parity
      - runtime-contracts-python
      - runtime-contracts-spirit
      - test
      - emissary-tests
      - respond-proof
      - mcp-resource-server
      - site-contract
      - api-image
      - postgres-proofs
      - static-contracts
      - baseline
      - shellcheck
      - mind-fast
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.plan.result != 'success' || needs.plan.outputs.baseline_strict == 'true') }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Require every full-suite owner to pass
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          required = {
              "plan", "shell-contracts", "shell-contracts-loom", "multiplayer-poc-tests", "artifacts-tests",
              "runtime-parity", "runtime-contracts-python", "runtime-contracts-spirit", "test", "emissary-tests", "respond-proof",
              "mcp-resource-server", "site-contract", "api-image", "postgres-proofs",
              "static-contracts", "baseline", "shellcheck", "mind-fast",
          }
          results = json.loads(os.environ["CI_NEEDS_JSON"])
          if set(results) != required:
              sys.exit("Full CI evidence is incomplete")
          failed = sorted(name for name in required if results[name].get("result") != "success")
          if failed:
              sys.exit("Full CI did not pass: " + ", ".join(failed))
          print("Every full-suite owner passed")
          PY
