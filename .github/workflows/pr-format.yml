name: PR Format

# Deterministic gate for the PR description convention
# (.claude/context/pr-format.md). Applies to every author — human or any
# agent harness. Fails the check and posts a fix-it comment; exempts
# drafts, release PRs, and bots.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-format:
    name: pr-format
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = pr.title || '';
            const body = pr.body || '';

            if (/^release[(:]/.test(title) || pr.user.type === 'Bot') {
              core.info('Exempt PR (release/bot) — skipping format check.');
              return;
            }

            const problems = [];
            if (!body.trim()) {
              problems.push('Description is empty — every PR needs one.');
            } else {
              if (!/^##\s+What\b/m.test(body)) problems.push('Missing `## What` section.');
              if (!/^##\s+Why\b/m.test(body)) problems.push('Missing `## Why` section.');
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const touchesCode = files.some(f => !f.filename.endsWith('.md'));
            if (touchesCode && !/^##\s+(Verification|Testing)\b/m.test(body)) {
              problems.push('Missing `## Verification` section — required because the diff touches non-markdown files. Say how this was checked, or state plainly that it was not.');
            }

            const titleOk = /^(feat|fix|docs|refactor|chore|test|perf|ci|build|release)(\([\w ./-]+\))?!?: \S/.test(title);
            const advisory = titleOk ? '' : '\n> Advisory (not gated): title should follow `type(scope): imperative summary`.';

            const marker = '<!-- pr-format-check -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));

            if (problems.length === 0) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id,
                  body: marker + '\n✅ PR format check passed.',
                });
              }
              core.info('PR format OK.');
              return;
            }

            const fixit = [
              marker,
              '### ❌ PR format check',
              '',
              ...problems.map(p => '- ' + p),
              advisory,
              '',
              'Required shape (spec: `.claude/context/pr-format.md`):',
              '',
              '```markdown',
              '## What',
              '- the change, most important first',
              '',
              '## Why',
              'the motivation — context the diff cannot show',
              '',
              '## Verification',
              'how this was checked (required when non-markdown files change)',
              '```',
              '',
              'Edit the PR description — this check reruns automatically.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: fixit });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: fixit });
            }
            core.setFailed(problems.join(' | '));
