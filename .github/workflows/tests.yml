name: Tests

# Temporarily paused for automatic push/PR runs while the required merge
# checks are reassessed. Keep the workflow available for deliberate manual
# validation without consuming Actions minutes on every change.
on:
  workflow_dispatch:

jobs:
  oss-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check — all shell scripts
        run: |
          FAIL=0
          for f in bin/*.sh bin/lib/*.sh; do
            if ! bash -n "$f" 2>/dev/null; then
              echo "FAIL: $f"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: No hardcoded internal references
        run: |
          # Check bin/ scripts for Curve-Labs references (should be parameterized)
          FOUND=$(grep -rn "Curve-Labs\|curve-labs\|curvelabs" bin/ --include='*.sh' | grep -v 'test-' || true)
          if [ -n "$FOUND" ]; then
            echo "Found internal references in bin/ scripts:"
            echo "$FOUND"
            exit 1
          fi

      - name: No unsafe .env sourcing
        run: |
          FOUND=$(grep -rn 'source.*\.env' bin/ --include='*.sh' | grep -v 'test-' | grep -v '#' || true)
          if [ -n "$FOUND" ]; then
            echo "Found unsafe 'source .env':"
            echo "$FOUND"
            exit 1
          fi

      - name: No manual JSON construction
        run: |
          FOUND=$(grep -rn '"{\\\"' bin/ --include='*.sh' | grep -v 'test-' || true)
          if [ -n "$FOUND" ]; then
            echo "Found manual JSON construction (use jq -n):"
            echo "$FOUND"
            exit 1
          fi

      - name: Local mode graceful degradation
        run: |
          FAIL=0
          for script in bin/graph.sh bin/notify.sh bin/graph-op.sh; do
            if [ -f "$script" ] && ! grep -q '"local"' "$script" 2>/dev/null; then
              echo "FAIL: $script missing local mode handling"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Commands have valid structure
        run: |
          FAIL=0
          COMMAND_FILES=$(find .claude/commands -name '*.md' -type f 2>/dev/null || true)
          if [ -z "$COMMAND_FILES" ]; then
            COMMAND_FILES=$(find .claude/skills -name 'SKILL.md' -type f 2>/dev/null || true)
          fi
          if [ -z "$COMMAND_FILES" ]; then
            echo "FAIL: no Claude command or skill files found"
            exit 1
          fi
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            # Every command should have content (not empty)
            LINES=$(wc -l < "$cmd" | tr -d ' ')
            if [ "$LINES" -lt 3 ]; then
              echo "FAIL: $cmd is too short ($LINES lines)"
              FAIL=1
            fi
          done <<< "$COMMAND_FILES"
          echo "Checked $(echo "$COMMAND_FILES" | wc -l | tr -d ' ') command/skill files"
          exit $FAIL

      - name: Harvest question palette contract
        run: bash tests/test-harvest-question-palette.sh

      - name: Convention parity (commit/PR format paragraphs)
        run: bash tests/test-convention-parity.sh

  worktree-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run worktree tests
        run: bash tests/test-worktree.sh

      - name: Run agent protocol smoke test
        run: bash tests/test-agent-protocol.sh

  multiplayer-poc-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test multiplayer Thread protocol, governance, lifecycle, and dependency continuation
        run: node --test threads/experiments/multiplayer-poc/test/*.test.mjs

  greeting-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq zsh

      - name: Test greeting in Bash and Zsh
        run: bash bin/test-greeting.sh

      - name: Test pending-turn greeting projection
        run: bash tests/test-greeting-pending-turns.sh

      - name: Test runtime mode status
        run: bash bin/tests/test-runtime-mode-status.sh

      - name: Test framework sync path parity
        run: bash bin/tests/test-framework-sync-paths.sh

      - name: Test packaged runtime parity
        working-directory: packages/create-egregore
        run: npm test

  loom-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: routing
            script: bin/tests/test-loom.sh
          - name: truth
            script: bin/tests/test-loom-truth.sh
          - name: evals
            script: bin/tests/test-loom-evals.sh
          - name: learner
            script: bin/tests/test-loom-learner.sh
          - name: replay
            script: bin/tests/test-loom-replay.sh
          - name: scenarios
            script: bin/tests/test-loom-scenarios.sh
          - name: dashboard
            script: bin/tests/test-loom-dashboard.sh
          - name: minion-workflow
            script: bin/tests/test-minion-workflow.sh
    name: Loom — ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Loom suite
        run: bash "${{ matrix.script }}"

  # Functional gate for the npm-published renderer packages. Previously these
  # tests ran in NO workflow — a broken egregore-artifacts could reach every
  # `npx egregore-artifacts@latest` consumer (i.e. every /view). This job runs
  # the suite on PRs to develop/main; release.yml runs the same gate before publish.
  artifacts-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install egregore-artifacts deps
        working-directory: packages/egregore-artifacts
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Re-vendor design-system (build dist + copy into the package)
        working-directory: packages/egregore-artifacts
        run: npm run vendor

      - name: Test egregore-artifacts
        working-directory: packages/egregore-artifacts
        run: npm test

      - name: Test design-system
        working-directory: packages/design-system
        run: npm test
