name: ShellCheck

# Pull requests only. The push trigger carried no branch filter, so every
# commit pushed to a dev/* branch linted once on the push and again on the
# pull request — measured, twice as many runs as pull requests for the same
# result. A pull request is checked against refs/pull/N/merge, which is the
# merged tree, so the push run added nothing the pull request had not seen.
on:
  pull_request:
    paths:
      - 'bin/**/*.sh'
      - '.claude/hooks/**/*.sh'
      - 'packages/create-egregore/**'
      # Skill and spec-surface edits must rebuild the committed runtime
      # bundles and keep Codex parity green — previously these paths triggered
      # no bundle/parity check at all and the generated surfaces went stale.
      - '.claude/skills/**'
      - '.codex/skills/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'capability-distribution.json'

# A new commit supersedes the run already in flight. Without this, pushing a
# fixup leaves the previous run going to completion with nobody reading it.
concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on bin/ scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'
          severity: error
          format: gcc

  portable-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify packaged runtime portability
        working-directory: packages/create-egregore
        run: npm test

  codex-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Codex native-skill and adapter parity
        run: bash bin/tests/test-codex-native-skills.sh

      - name: Codex spec render freshness and 32 KiB budget
        run: bash bin/tests/test-codex-spec-render.sh

      - name: Skill contract (skill-v1, strict)
        run: node bin/capability-distribution.mjs skill-contract --strict-contract
