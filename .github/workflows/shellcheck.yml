name: ShellCheck

on:
  push:
    paths:
      - 'bin/**/*.sh'
  pull_request:
    paths:
      - 'bin/**/*.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on bin/ scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'
          severity: error
          format: gcc
