name: ShellCheck

on:
  push:
    paths:
      - 'bin/**/*.sh'
      - '.claude/hooks/**/*.sh'
      - 'packages/create-egregore/**'
  pull_request:
    paths:
      - 'bin/**/*.sh'
      - '.claude/hooks/**/*.sh'
      - 'packages/create-egregore/**'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on bin/ scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'
          severity: error
          format: gcc

  portable-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify packaged runtime portability
        working-directory: packages/create-egregore
        run: npm test
