name: ShellCheck

on:
  push:
    paths:
      - '**/*.bash'
      - '**/*.sh'
  pull_request:
    paths:
      - '**/*.bash'
      - '**/*.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on bin/ scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin'
          severity: error
          format: gcc

      - name: Reject non-portable Bash shebangs
        shell: bash
        run: |
          fail=0
          while IFS= read -r -d '' file; do
            if [ "$(head -n 1 "$file")" = '#!/bin/bash' ]; then
              echo "Non-portable Bash shebang: $file"
              fail=1
            fi
          done < <(git ls-files -z -- '*.bash' '*.sh')
          exit "$fail"
